{{- /* chezmoi:modify-template */ -}}
{{- /* btop rewrites btop.conf on exit, so only its color_theme line is managed. */ -}}
{{- $line := `color_theme = "catppuccin_mocha"` -}}
{{- if regexMatch `(?m)^color_theme = ` .chezmoi.stdin -}}
{{-   regexReplaceAll `(?m)^color_theme = .*$` .chezmoi.stdin $line -}}
{{- else -}}
{{-   $line }}
{{ .chezmoi.stdin -}}
{{- end -}}
