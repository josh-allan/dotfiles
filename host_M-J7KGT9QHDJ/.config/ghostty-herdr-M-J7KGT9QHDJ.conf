# Forward Ghostty pane controls to Herdr (prefix Ctrl+B).
env = HERDR_CONFIG_PATH=/Users/josh/.config/herdr-host-M-J7KGT9QHDJ/config.toml
keybind = ctrl+shift+h=text:\x02h
keybind = ctrl+shift+j=text:\x02j
keybind = ctrl+shift+k=text:\x02k
keybind = ctrl+shift+l=text:\x02l
keybind = alt+minus=text:\x02-
keybind = alt+backslash=text:\x02v
keybind = ctrl+semicolon=text:\x02z

# macOS shortcuts for Herdr panes, tabs, and workspaces.
keybind = cmd+h=text:\x02h
keybind = cmd+j=text:\x02j
keybind = cmd+k=text:\x02k
keybind = cmd+l=text:\x02l
keybind = cmd+alt+arrow_left=text:\x02h
keybind = cmd+alt+arrow_down=text:\x02j
keybind = cmd+alt+arrow_up=text:\x02k
keybind = cmd+alt+arrow_right=text:\x02l
keybind = cmd+d=text:\x02v
keybind = cmd+shift+d=text:\x02-
keybind = cmd+[=text:\x02[
keybind = cmd+]=text:\x02]
keybind = cmd+t=text:\x02c
keybind = cmd+n=text:\x02N
keybind = cmd+r=text:\x02T
keybind = cmd+w=text:\x02x
keybind = cmd+shift+enter=text:\x02z
keybind = cmd+backslash=text:\x02\\

# Switch Herdr tabs and workspaces by index.
keybind = cmd+digit_1=text:\x021
keybind = cmd+digit_2=text:\x022
keybind = cmd+digit_3=text:\x023
keybind = cmd+digit_4=text:\x024
keybind = cmd+digit_5=text:\x025
keybind = cmd+digit_6=text:\x026
keybind = cmd+digit_7=text:\x027
keybind = cmd+digit_8=text:\x028
keybind = cmd+digit_9=text:\x029
keybind = cmd+shift+digit_1=text:\x02w1
keybind = cmd+shift+digit_2=text:\x02w2
keybind = cmd+shift+digit_3=text:\x02w3
keybind = cmd+shift+digit_4=text:\x02w4
keybind = cmd+shift+digit_5=text:\x02w5
keybind = cmd+shift+digit_6=text:\x02w6
keybind = cmd+shift+digit_7=text:\x02w7
keybind = cmd+shift+digit_8=text:\x02w8
keybind = cmd+shift+digit_9=text:\x02w9

# Alt+Shift split shortcuts from the upstream Ghostty config.
keybind = alt+shift+slash=text:\x02v
keybind = alt+shift+minus=text:\x02-
