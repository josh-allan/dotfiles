# Disable RAOP (AirPlay) discovery.
#
# Without this, libpipewire-module-raop-discover mDNS-scans the LAN and creates
# a sink for every AirPlay receiver it finds (Sonos, Apple TV, other people's
# Macs), making it trivial to grab a device that isn't ours.
#
# This file shadows /usr/share/pipewire/pipewire.conf.d/50-raop.conf by name,
# so the module is never declared. The property is set as well so the module
# stays off even if the distro renames or restructures that file.

context.properties = {
    module.raop = false
}

context.modules = [
]
