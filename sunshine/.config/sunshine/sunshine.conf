gamepad = xone
capture = wlr
# Pin the 9070 XT VAAPI encoder so a broken driver fails loudly instead of
# silently falling back to libx264 (Fedora's stock mesa lacks H.264/HEVC encode;
# needs mesa-va-drivers-freeworld from RPM Fusion).
encoder = vaapi
adapter_name = /dev/dri/renderD128
av1_mode = 2
