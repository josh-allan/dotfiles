# Portable CLI tools. System/GUI packages live in packages.json.
# btop and eza stay in packages.json: their GitHub releases ship no macOS assets.
# Registry audit: docs/plans/2026-07-20-mise-installer.md

[tools]
ast-grep = "latest"
bat = "latest"
biome = "latest"
cowsay = "latest"
delta = "latest"           # packages.json name: git-delta
direnv = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
golangci-lint = "latest"
hugo = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
opencode = "2.2.5"
pnpm = "latest"
prettier = "latest"
ripgrep = "latest"
ruff = "latest"
rust = "latest"
shellcheck = "latest"
tree-sitter = "latest"     # packages.json name: tree-sitter-cli
yarn = "latest"
zoxide = "latest"
"npm:fish-lsp" = "latest"

[tasks.install-tools]
description = "Install portable CLI tools via mise"
run = "mise install"

[tasks.install-apps]
description = "Install GUI apps and system packages via brew/yay (packages.json)"
# sudo and brew prompt for passwords; parallel tasks get no terminal unless interactive.
interactive = true
run = "./scripts/install-deps.sh"

[tasks.bootstrap]
description = "Full new-machine setup: tools, apps, then chezmoi init + apply"
# chezmoi init prompts for the host profile on /dev/tty.
interactive = true
depends = ["install-tools", "install-apps"]
# ensure-access: GitHub SSH (needed by init); 1Password optional, warns if not signed in. chezmoi is pinned in the
# global mise config, which isn't linked until this apply runs.
run = [
    "./scripts/ensure-access.sh",
    "mise exec chezmoi@latest -- chezmoi init --source ~/.dotfiles --apply",
    "echo 'Bootstrap complete. Open a new shell so fish picks up mise activation.'",
]

[tasks.sync]
description = "Apply dotfiles (chezmoi apply)"
run = "chezmoi apply"

[tasks.diff]
description = "Show what chezmoi apply would change"
run = "chezmoi diff"

[tasks.migrate]
description = "One-time cutover of a stow-managed machine to chezmoi"
run = "mise exec chezmoi@latest -- ./scripts/migrate-from-stow.sh"

[tasks.store-gpg-key]
description = "Upload the git signing key to 1Password for other machines"
run = "./scripts/store-gpg-key.sh"
